name: P5 Knowledge Worker

on:
  push:
    paths:
      - "projects/p5_knowledge_worker/**"
      - ".github/workflows/p5-knowledge-worker.yml"
  pull_request:
    paths:
      - "projects/p5_knowledge_worker/**"
      - ".github/workflows/p5-knowledge-worker.yml"

permissions:
  contents: read

concurrency:
  group: p5-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/p5_knowledge_worker/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: projects/p5_knowledge_worker/api/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check .
      # Tests use a fake embedder, reranker and LLM with in-memory Qdrant: no model downloads.
      - run: uv run pytest -q

  web:
    name: Web (lint + types + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/p5_knowledge_worker/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: projects/p5_knowledge_worker/web/package-lock.json
      - run: npm ci
      - run: npx eslint src
      # Route types (LayoutProps, PageProps) are generated, not committed; tsc needs them.
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run build

  docker:
    name: Docker images build
    needs: [api, web]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/p5_knowledge_worker
    steps:
      - uses: actions/checkout@v4
      # Only builds the images; nothing is run or pushed.
      - run: docker compose build
