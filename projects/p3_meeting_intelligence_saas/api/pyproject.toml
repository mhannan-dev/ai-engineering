[project]
name = "meeting-intelligence-api"
version = "0.1.0"
description = "FastAPI backend for hybrid audio transcription (faster-whisper / Deepgram) and structured meeting-minutes synthesis."
readme = "../README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "av>=11,<19",
    "cryptography>=50.0.2",
    "deepgram-sdk>=7.12.0",
    "fastapi[standard]>=0.142.2",
    "faster-whisper>=1.2.1",
    "instructor>=1.17.0",
    "litellm>=1.103.2",
    "pillow>=12.3.0",
    "pydantic-settings>=2.15.0",
    "pymysql>=1.2.3",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.1.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src", "."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP"]
ignore = ["E501"]
